name: Update FRED data

on:
  schedule:
    # 11:10 UTC daily — after FRED's usual morning releases (8:30 ET).
    - cron: '10 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-fred-data.mjs'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-fred-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/fetch-fred-data.mjs

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fred-data.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): refresh FRED snapshot"
          # A queued run checks out the SHA it was triggered at, so another
          # run's snapshot may have landed since. Rebase and retry rather
          # than failing the job.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "Could not push the snapshot after 3 attempts."
          exit 1
