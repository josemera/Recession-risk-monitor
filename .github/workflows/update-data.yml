name: Update FRED data

on:
  schedule:
    # 11:10 UTC daily — after FRED's usual morning releases (8:30 ET).
    - cron: '10 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-fred-data.mjs'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-fred-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/fetch-fred-data.mjs

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fred-data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh FRED snapshot"
            git push
          fi
